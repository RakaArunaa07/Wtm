<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Montserrat:wght@700;800;900&amp;family=Roboto+Slab:wght@700;900&amp;display=swap');
      .txt-w { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 115px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .txt-t { font-family: 'Roboto Slab', serif; font-weight: 900; font-size: 118px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .txt-since { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 19px; fill: #ffffff; letter-spacing: 2px; text-anchor: middle; }
      .txt-title { font-family: 'Bebas Neue', sans-serif; font-size: 44px; fill: #ffffff; letter-spacing: 2.5px; text-anchor: middle; }
      .txt-slogan { font-family: 'Bebas Neue', sans-serif; font-size: 25px; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="242" fill="#050505" stroke="#ffffff" stroke-width="5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#ffffff" stroke-width="12" />

  <!-- Diagonal Cross (X) -->
  <line x1="135" y1="105" x2="360" y2="330" stroke="#ffffff" stroke-width="13" stroke-linecap="square" />
  <line x1="365" y1="105" x2="135" y2="330" stroke="#ffffff" stroke-width="13" stroke-linecap="square" />

  <!-- Top: Coffee Cup with Heart & Steam -->
  <!-- Steam lines -->
  <path d="M 230 75 Q 225 60 230 46" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 250 75 Q 245 60 250 46" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 270 75 Q 265 60 270 46" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Cup Body -->
  <path d="M 205 82 L 295 82 L 285 130 Q 250 142 215 130 Z" fill="#050505" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" />
  
  <!-- Cup Handle -->
  <path d="M 292 90 L 306 90 Q 312 90 312 98 L 312 110 Q 312 118 300 118 L 287 118" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" />

  <!-- Heart on Cup -->
  <path d="M 250 120 C 243 112 233 104 233 97 C 233 92 237 88 243 88 C 247 88 249 90 250 93 C 251 90 253 88 257 88 C 263 88 267 92 267 97 C 267 104 257 112 250 120 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

  <!-- Cup Saucer -->
  <path d="M 205 145 L 295 145" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" />

  <!-- Left: Letter W -->
  <text x="128" y="215" class="txt-w">W</text>

  <!-- Right: Letter T -->
  <text x="375" y="215" class="txt-t">T</text>

  <!-- Bottom: Since 2024 with lines -->
  <line x1="175" y1="312" x2="205" y2="312" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <text x="250" y="318" class="txt-since">SINCE 2024</text>
  <line x1="295" y1="312" x2="325" y2="312" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Bottom: WARKOP TENGAH MALAM -->
  <text x="250" y="375" class="txt-title">WARKOP TENGAH MALAM</text>

  <!-- Bottom: NONGKRONG GAK HARUS MAHAL -->
  <text x="250" y="405" class="txt-slogan">NONGKRONG GAK HARUS MAHAL</text>
</svg>
